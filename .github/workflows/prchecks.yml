on:
  pull_request:
    branches:
      - main
      
name: Binary checks

jobs:

  readme:
    name: README.md is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that README.md was knitted from README.Rmd
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          rmd=$(echo "$changed" | grep -qx 'README.Rmd' && echo yes || echo no)
          md=$(echo "$changed" | grep -qx 'README.md' && echo yes || echo no)
          if [ "$rmd" = yes ] && [ "$md" = no ]; then
            echo "::error file=README.Rmd::README.Rmd changed but README.md did not. Run rmarkdown::render('README.Rmd') and commit README.md."
            exit 1
          fi
          if [ "$md" = yes ] && [ "$rmd" = no ]; then
            echo "::error file=README.md::README.md changed but README.Rmd did not. Edit README.Rmd, then run rmarkdown::render('README.Rmd')."
            exit 1
          fi
          if [ "$rmd" = yes ] && [ "$(git log -1 --format=%ct -- README.md)" -lt "$(git log -1 --format=%ct -- README.Rmd)" ]; then
            echo "::error file=README.md::README.md is older than README.Rmd. Run rmarkdown::render('README.Rmd') and commit README.md."
            exit 1
          fi
          echo "README.md and README.Rmd are in step."

  build:
    name: Build for ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install Mac dependencies
        if: runner.os == 'macOS'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
          brew install autoconf
          brew install automake

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::rcmdcheck
            any::lintr
            any::spelling
            any::covr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          upload-snapshots: true
